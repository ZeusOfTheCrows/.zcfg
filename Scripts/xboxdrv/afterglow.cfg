# Evdev Example
# =============
#
# Xboxdrv allows to not only the use of Xbox1 and Xbox360 controllers,
# but also every other controller supported by Linux. To use them they
# have however to be remapped to the Xbox360 button layout. While this
# process is a bit chumbersome, such a configuration can be reused and
# layout on top of regular xboxdrv configuration, i.e. if you store
# your evdev to Xbox360 in the file evdev.xboxdrv and your custom
# xboxdrv configuration in xbox360.xboxdrv you can use them both at
# the same time with:
#
#   xboxdrv -c evdev.xboxdrv -c xbox360.xboxdrv
#
# The following example is for the Microsoft Sidewinder Precision 2
# joystick.

[xboxdrv]
# Using the 'by-id' name is recomment, as it is static, while an
# /dev/input/eventX name can change depending on what other USB
# devices you use.
evdev = /dev/input/by-id/usb-Performance_Designed_Products_Afterglow_Wired_Controller_for_Xbox_One_00008F90488C9952-event-joystick
# evdev = /dev/input/by-id/usb-Performance_Designed_Products_Afterglow_Wired_Controller_for_Xbox_One_00008F90488C9952-joystick

# This displays events received from the controller, if you are
# working on a configuration you want to set this to true:
; evdev-debug = true
# suppress output (disable for debug)
silent = true

# Grabbing the device prevents other applications from accessing it,
# this is needed most of the time te prevent applications from
# receiving events twice.
evdev-grab = true

# ~~for debugging, probably replace xpad with this kernel driver after testing~~
# seems to work fine, and i don't want mess with xpad which works
; detach-kernel-driver = true

# explicitly setting ANY name breaks RS and HOME bindings (why?) so i'm reusing
# the id's from afterglow controller
vendor-id = 0e6f
product-id = 0139
# device-name = "Xboxdrv Virtual Controller"

# very small, should be just big enough
deadzone = 3500

[evdev-absmap]
ABS_X = X1
ABS_Y = Y1

ABS_HAT0X = dpad_x
ABS_HAT0Y = dpad_y

ABS_RX = X2
ABS_RY = Y2

ABS_Z = LT
ABS_RZ = RT

[evdev-keymap]
BTN_A = A
BTN_B = B
BTN_X = X
BTN_Y = Y

BTN_TL = LB
BTN_TR = RB

BTN_SELECT = back
BTN_START = start
BTN_MODE = guide
BTN_THUMBL = TL
BTN_THUMBR = TR

[axismap]
# invert y axes
-Y1 = Y1
-Y2 = Y2

# [ui-buttonmap]
